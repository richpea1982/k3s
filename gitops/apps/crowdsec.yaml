apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crowdsec
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://crowdsecurity.github.io/helm-charts
    chart: crowdsec
    targetRevision: "0.24.0"
    helm:
      values: |
        agent:
          env:
            - name: COLLECTIONS
              value: "crowdsecurity/traefik crowdsecurity/linux"
            - name: PARSERS
              value: "crowdsecurity/cri-logs"
          acquisition: []
          additionalAcquisition:
            - source: file
              filenames:
                - /var/log/containers/traefik-*_kube-system_traefik-*.log
              labels:
                type: containerd
                program: traefik
              poll_without_inotify: true
        config:
          parsers:
            s00-raw:
              promote-program-label.yaml: |
                name: local/promote-program-label
                description: "Promote the acquisition 'program' label into evt.Parsed.program (traefik-logs v1.5 file-source bug workaround)"
                filter: "evt.Line.Labels.program != nil && evt.Line.Labels.program != ''"
                statics:
                  - parsed: program
                    expression: "evt.Line.Labels.program" 
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
