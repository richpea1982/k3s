apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "87.16.1"
    helm:
      skipCrds: true
      values: |
        prometheus:
          prometheusSpec:
            retention: 15d
            retentionSize: "25Gi"         # Prevents unexpected TSDB growth
            walCompression: true          # Reduces WAL disk footprint and RAM spike during replay
            resources:
              requests: { cpu: 200m, memory: 1536Mi }
              limits: { memory: 3584Mi }
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: ceph-rbd
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests: { storage: 20Gi }
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false

          additionalPrometheusRulesMap:
            k3s-node-health:
              groups:
                - name: k3s-node-health
                  rules:
                    - alert: K3sNodeDown
                      expr: kube_node_status_condition{condition="Ready", status="true"} == 0
                      for: 5m
                      labels:
                        severity: critical
                      annotations:
                        summary: "K3s node {{ $labels.node }} has been NotReady for 5+ minutes"
                        description: "Fires the alert-router on pve1: Terraform replace + Ansible rejoin for this node."

        alertmanager:
          alertmanagerSpec:
            resources:
              requests: { cpu: 50m, memory: 128Mi }
              limits: { memory: 256Mi }
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: ceph-rbd
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests: { storage: 20Gi }
          config:
            route:
              receiver: "null"
              routes:
                - matchers:
                    - alertname = "K3sNodeDown"
                  receiver: alert-router
                  repeat_interval: 15m
            receivers:
              - name: "null"
              - name: alert-router
                webhook_configs:
                  - url: "http://10.0.10.17:8080/webhook/alertmanager"
                    send_resolved: true

        grafana:
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          
          # Disable local PVC storage; Grafana state lives in Postgres
          persistence:
            enabled: false

          envValueFrom:
            GF_DATABASE_PASSWORD:
              secretKeyRef:
                name: grafana-db-secret
                key: password

          grafana.ini:
            database:
              type: postgres
              host: grafana-postgres.monitoring.svc.cluster.local:5432
              name: grafana
              user: grafana
              ssl_mode: disable
            analytics:
              check_for_updates: false

          strategy:
            type: Recreate
          sidecar:
            dashboards:
              env:
                REQ_HEALTH_PORT: "10801"
            datasources:
              env:
                REQ_HEALTH_PORT: "10802"

        kubeStateMetrics:
          enabled: true
        nodeExporter:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
