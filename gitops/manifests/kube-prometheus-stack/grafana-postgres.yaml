apiVersion: v1
kind: Secret
metadata:
  name: grafana-db-secret
  namespace: monitoring
type: Opaque
stringData:
  password: "GrafanaPGSecurePassword123!"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana-postgres
  namespace: monitoring
spec:
  serviceName: grafana-postgres
  replicas: 1
  selector:
    matchLabels:
      app: grafana-postgres
  template:
    metadata:
      labels:
        app: grafana-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: grafana
            - name: POSTGRES_USER
              value: grafana
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-db-secret
                  key: password
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd
        resources:
          requests: { storage: 5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-postgres
  namespace: monitoring
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: grafana-postgres
