# Same reasoning as Photoprism's MariaDB: a live RDBMS needs a real block
# device for WAL/fsync guarantees, so this sits on ceph-rbd rather than NFS.
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: glpi
spec:
  clusterIP: None
  selector:
    app: mariadb
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: glpi
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                # Provides MYSQL_ROOT_PASSWORD / MYSQL_DATABASE / MYSQL_USER
                # / MYSQL_PASSWORD (MariaDB's official image accepts both
                # MYSQL_* and MARIADB_* names — MYSQL_* used here to match
                # the existing Photoprism convention in this repo).
                # Created manually — see GLPI-README.md. Not in Git, same
                # as vaultwarden-secrets / photoprism-secrets.
                name: glpi-secrets
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
          # Same startupProbe reasoning as Photoprism's MariaDB: first-run
          # InnoDB tablespace creation can outlast a short liveness probe
          # window under a 100m CPU request, and a probe killing the
          # container mid-write is what corrupts it. startupProbe holds
          # liveness/readiness off until first boot genuinely succeeds
          # once (up to 300s here).
          startupProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            failureThreshold: 90
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            initialDelaySeconds: 20
            periodSeconds: 60
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
  volumeClaimTemplates:
    - metadata:
        name: mariadb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 5Gi
