# Internal-only, same pattern as vault.pearsalls.fr / photos.pearsalls.fr:
# a real subdomain (needed for Let's Encrypt DNS-01) with no public
# A/CNAME record — resolve manually via /etc/hosts on admin devices
# pointing at a K3s node IP, or port-forward, until Unbound split-horizon
# DNS is live. CrowdSec bouncer attached from day one (part of the
# current bouncer rollout batch alongside Vaultwarden/ArgoCD/Jellyfin).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: glpi
  namespace: glpi
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`glpi.pearsalls.fr`)
      kind: Rule
      middlewares:
        - name: glpi-admin-only
        - name: crowdsec-bouncer
          namespace: kube-system
      services:
        - name: glpi
          port: 80
  tls:
    certResolver: cloudflare
