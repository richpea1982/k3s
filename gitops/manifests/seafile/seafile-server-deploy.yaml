apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile-server
  namespace: seafile
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seafile-server
  template:
    metadata:
      labels:
        app: seafile-server
    spec:
      initContainers:
        - name: wait-for-mariadb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 mariadb 3306; do
                echo "waiting for mariadb..."
                sleep 2
              done
      containers:
        - name: seafile-server
          image: ggogel/seafile-server:11.0.13
          ports:
            - containerPort: 8082
            - containerPort: 8001
          env:
            - name: DB_HOST
              value: "mariadb"
            - name: DB_ROOT_PASSWD
              valueFrom:
                secretKeyRef:
                  name: seafile-secrets
                  key: mysql-root-password
            - name: TIME_ZONE
              value: "Europe/Paris"
            - name: HTTPS
              value: "true"
            - name: SEAFILE_URL
              value: "seafile.pearsalls.fr"
          volumeMounts:
            - name: seafile-data
              mountPath: /shared
          startupProbe:
            tcpSocket:
              port: 8082
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8082
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8082
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: seafile-data
          persistentVolumeClaim:
            claimName: seafile-data
---
apiVersion: v1
kind: Service
metadata:
  name: seafile-server
  namespace: seafile
spec:
  selector:
    app: seafile-server
  ports:
    - port: 8082
      targetPort: 8082
    - port: 8001
      targetPort: 8001
