apiVersion: apps/v1
kind: Deployment
metadata:
  name: seahub
  namespace: seafile
spec:
  replicas: 1
  strategy:
    type: Recreate # same reasoning as seafile-server — shared RWX volume
  selector:
    matchLabels:
      app: seahub
  template:
    metadata:
      labels:
        app: seahub
    spec:
      initContainers:
        - name: wait-for-mariadb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 mariadb 3306; do
                echo "waiting for mariadb..."
                sleep 2
              done
        - name: wait-for-seafile-server
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 seafile-server 8082; do
                echo "waiting for seafile-server..."
                sleep 2
              done
          volumeMounts:
            - name: seafile-data
              mountPath: /shared
      containers:
        - name: seahub
          image: ggogel/seahub:11.0.13
          ports:
            - containerPort: 8000
          env:
            # Note: no DB_HOST/DB_ROOT_PASSWD here — seahub reads DB
            # connection details from the config files seafile-server
            # already wrote into the shared /shared volume on its own
            # first boot. This matches ggogel's compose file exactly;
            # do not add DB env vars here on the assumption they're
            # missing — they're deliberately absent.
            - name: SEAFILE_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: seafile-secrets
                  key: admin-email
            - name: SEAFILE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-secrets
                  key: admin-password
          volumeMounts:
            - name: seafile-data
              mountPath: /shared
            - name: seahub-avatars
              mountPath: /shared/seafile/seahub-data/avatars
            - name: seahub-custom
              mountPath: /shared/seafile/seahub-data/custom
          startupProbe:
            httpGet:
              path: /
              port: 8000
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: seafile-data
          persistentVolumeClaim:
            claimName: seafile-data
        - name: seahub-avatars
          persistentVolumeClaim:
            claimName: seahub-avatars
        - name: seahub-custom
          persistentVolumeClaim:
            claimName: seahub-custom
---
apiVersion: v1
kind: Service
metadata:
  name: seahub
  namespace: seafile
spec:
  selector:
    app: seahub
  ports:
    - port: 8000
      targetPort: 8000
