---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-isolation
  namespace: seafile
spec:
  podSelector:
    matchLabels:
      app: mariadb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: seafile-server
      ports:
        - protocol: TCP
          port: 3306
    - from:
        - podSelector:
            matchLabels:
              app: seahub
      ports:
        - protocol: TCP
          port: 3306
    # Nightly mysqldump CronJob — dedicated label, not "app: mariadb",
    # same reasoning as vaultwarden's postgres-backup rule.
    - from:
        - podSelector:
            matchLabels:
              job: mariadb-backup
      ports:
        - protocol: TCP
          port: 3306
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memcached-isolation
  namespace: seafile
spec:
  podSelector:
    matchLabels:
      app: memcached
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: seahub
      ports:
        - protocol: TCP
          port: 11211
